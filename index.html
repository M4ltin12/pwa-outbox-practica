<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#353E4D">
  <meta name="description" content="Registro de incidencias en campo">
  <title>Reportes de campo</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
</head>
<body>
  <div class="app">
    <header class="cabecera">
      <div class="cabecera-texto">
        <h1>Reportes de campo</h1>
        <p class="subtitulo">Registro de incidencias</p>
      </div>
      <span id="badge-red" class="badge online" role="status" aria-live="polite">Conectado</span>
    </header>

    <p id="mensaje-estado" class="mensaje-estado" role="status" aria-live="polite" hidden></p>

    <section class="seccion" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nuevo reporte</h2>
      <p class="ayuda">Anota lo que ocurrió.</p>
      <form id="form-incidencia" novalidate>
        <label for="titulo">Título</label>
        <input
          type="text"
          id="titulo"
          name="titulo"
          maxlength="120"
          required
          autocomplete="off"
        >

        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          rows="4"
          maxlength="1000"
          required
        ></textarea>

        <button type="submit" id="btn-enviar">Guardar reporte</button>
      </form>
    </section>

    <section class="seccion" aria-labelledby="titulo-outbox">
      <div class="cabecera-lista">
        <h2 id="titulo-outbox">Reportes guardados</h2>
        <button id="btn-purgar" type="button">Eliminar enviados</button>
      </div>
      <ul id="lista-outbox" class="lista-outbox"></ul>
    </section>
  </div>

  <script src="./db-helper.js"></script>
  <script src="./app.js"></script>
</body>
</html>
